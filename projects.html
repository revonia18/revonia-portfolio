<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revonia's Porfolio:Projects </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body class="projects-body">
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html"><img src="images/logo.png"></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contacts</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="projects-section">
            <h2 class="section-title">Crafted Projects</h2>

            <div class="projects-grid">

                <!-- Project Card 1 -->
                <article class="project-card">
                    <!-- Project Image Frame -->
                    <div class="project-image-wrapper">
                        <img src="images/project1-preview.png" alt="Campus Lost & Found Preview" class="project-img">
                        <span class="project-badge">Completed</span>
                    </div>

                    <!-- Project Details -->
                    <div class="project-content">
                        <h3 class="project-title">Campus Lost & Found</h3>
                        <p class="project-desc">
                            A local web app designed to help university students report and recover lost items across
                            campus.
                        </p>

                        <!-- Tech Tags -->
                        <div class="tech-tags">
                            <span class="tag">HTML5</span>
                            <span class="tag">CSS3</span>
                            <span class="tag">JavaScript</span>
                        </div>

                        <!-- Action Buttons -->
                        <div class="card-actions">
                            <a href="https://github.com/revonia18/wheres-my-stuff-campus-lost-found" target="_blank"
                                class="mc-button">
                                <span class="btn-text">Code</span>
                            </a>
                            <a href="https://wheresmystuff.codedex.me" target="_blank" class="mc-button primary">
                                <span class="btn-text">Live Demo</span>
                            </a>
                        </div>
                    </div>
                </article>
        </section>

        <section class="tech-inventory">
            <h2>Inventory: Tech Stack</h2>
            <div class="inventory-grid">

                <div class="inventory-slot" data-title="HTML5"
                    data-desc="Building block structure for modern web applications.">
                    <img src="images/html5.png" alt="HTML5 Pixel Icon" class="item-icon-img">
                    <span class="item-count">64</span>
                </div>

                <div class="inventory-slot" data-title="CSS3"
                    data-desc="Styling layouts, pixel themes, and UI animations.">
                    <img src="images/css3.png" alt="CSS3 Pixel Icon" class="item-icon-img">
                    <span class="item-count">64</span>
                </div>

                <div class="inventory-slot" data-title="JavaScript"
                    data-desc="Interactive logic, DOM manipulation, and dynamic features.">
                    <img src="images/javascript.png" alt="JavaScript Pixel Icon" class="item-icon-img">
                    <span class="item-count">99</span>
                </div>


                <div class="inventory-slot" data-title="SQL / PL/SQL"
                    data-desc="Relational databases, queries, and stored procedures.">
                    <img src="images/sql.png" alt="SQL Pixel Icon" class="item-icon-img">
                    <span class="item-count">32</span>
                </div>

                <!-- Slot 5: Figma -->
                <div class="inventory-slot" data-title="Figma & UI Design"
                    data-desc="UI/UX prototyping, wireframing, and pixel asset creation.">
                    <img src="images/figma.png" alt="Figma Pixel Icon" class="item-icon-img">
                    <span class="item-count">1</span>
                </div>

            </div>
        </section>
    </main>
    <footer>
    </footer>
</body>

</html>
