<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revonia's Porfolio:Contact </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body class="contact-body">
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html"><img src="images/logo.png" alt="Revonia logo"></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-card">
            <p class="section-kicker">Let’s connect</p>
            <h1>Contact Me!</h1>
            <p class="contact-intro">Looking to collaborate, build something together, or just say hi?</p>

            <form class="contact-form">
                <div class="form-field">
                    <label for="name">Name*</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>

                <div class="form-field">
                    <label for="email">Email*</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="form-field">
                    <label for="requests">Message</label>
                    <textarea id="requests" rows="5" placeholder="Your message"></textarea>
                </div>

                <button type="submit" class="mc-button primary contact-submit">Send!</button>
            </form>

            <div class="social-links" aria-label="Social media links">
                <a href="https://github.com/revonia18" target="_blank" rel="noreferrer" class="social-link github-link" aria-label="GitHub">
                    <img src="images/github.png" alt="GitHub">
                </a>
                <a href="https://www.linkedin.com/in/revoniamguni" target="_blank" rel="noreferrer" class="social-link linkedin-link" aria-label="LinkedIn">
                    <img src="images/linkedin.png" alt="LinkedIn">
                </a>
            </div>
        </section>
    </main>
</body>

</html>
