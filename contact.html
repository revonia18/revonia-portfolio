<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revonia's Porfolio:Contact </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body class="contact-body">
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html"><img src="images/logo.png"></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contacts</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Contact Me!</h2>
        <p>Looking to collaborate, build something together, or just say hi?</p>
        <form>
            <label for="name">Name*</label>
            <input type="text" id="name" required placeholder="enter your name"></input>
            <br><br>
            <label for="phone-number">Email*</label>
            <input type="email" id="email" required placeholder="enter your email">
            <br><br>
            <label for="requests">Message</label>
            <textarea id="requests" rows="4" cols="40" placeholder="your message"></textarea>
            <br><br>
            <button class="minecraft-btn">
                Send!
            </button>
        </form>
    </main>
    <footer>
    </footer>
</body>

</html>
